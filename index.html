<!doctype html><html lang="en"><head><script async src="https://www.googletagmanager.com/gtm.js?id=GTM-N5QZLXVX"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/style.css"><script src="assets/i18n.js"></script><script src="assets/specs-i18n.js"></script><script src="assets/app.js"></script><script src="assets/compute.js"></script><meta name="description" content="Open catalog of 193+ mobile robots — humanoids, quadrupeds, AMRs and dev platforms — with every published spec, sourced from maker datasheets."><title>Robot Catalog</title></head>
<body><script>nav("index.html")</script>
<main>
<h1 data-i18n="home_title"></h1>
<p class="muted" data-i18n="home_sub"></p>
<div class="stats" id="stats"></div>
<div class="controls"><input type="search" id="q" data-i18n-ph="search"><select id="chip"></select><div id="chips"></div></div>
<div class="grid" id="grid"></div>
</main><div id="foot"></div>
<script>
document.title=t("brand");
let robots=[],cat="All",chip="";
function render(){const q=document.getElementById("q").value.toLowerCase();
const list=robots.filter(r=>(cat==="All"||r.category===cat)&&(!chip||chipIds(r).includes(chip))&&(!q||(r.name+" "+r.manufacturer).toLowerCase().includes(q))).sort((a,b)=>a.manufacturer.localeCompare(b.manufacturer)||a.name.localeCompare(b.name));
document.getElementById("grid").innerHTML=list.map(r=>`<a class="card" href="robot.html?id=${encodeURIComponent(r.id)}">
<div class="mk">${esc(r.manufacturer)}</div><div class="nm">${esc(r.name)}</div>
<div><span class="tag" style="background:${CAT_COLORS[r.category]}22;color:${CAT_COLORS[r.category]}">${esc(tv(r.category))}</span><span class="tag plain">${esc(tv(r.locomotion))}</span></div>
<div class="kv"><span>${t("max_speed")}</span><span>${fmt(r.max_speed_mps,"m/s")}</span><span>${t("payload")}</span><span>${fmt(r.payload_kg,"kg")}</span><span>${t("ip")}</span><span>${fmt(r.ip_rating)}</span></div>
<div class="small">${FEATURES.map(([k,l])=>`${t(l)} ${yn(r[k])}`).join(" ")}</div>
${hasCompute(r)?`<div class="small">${t("compute_soc")}: ${esc(r.compute_soc||"—")}${r.compute_tops!=null?` · ${topsText(r)}`:``}</div>`:``}</a>`).join("")||`<p class="muted">${t("no_match")}</p>`;}
(async()=>{const d=await loadData();robots=d.robots;
const makers=new Set(robots.map(r=>r.manufacturer)).size;
document.getElementById("stats").innerHTML=`<div class="stat"><b>${robots.length}</b>${t("robots")}</div><div class="stat"><b>${makers}</b>${t("manufacturers")}</div><div class="stat"><b>${new Set(robots.map(r=>r.category)).size}</b>${t("categories")}</div>`;
document.getElementById("chips").innerHTML=["All",...CATS.filter(c=>robots.some(r=>r.category===c))].map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${c==="All"?t("all"):esc(tv(c))}</button>`).join(" ");
document.getElementById("chips").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.c===cat));render();}};
document.getElementById("q").oninput=render;document.getElementById("foot").innerHTML=footer(d.meta);
const fams=new Map();robots.forEach(r=>chipIds(r).forEach(id=>fams.set(id,(fams.get(id)||0)+1)));
const sel=document.getElementById("chip");sel.setAttribute("aria-label",t("chip"));sel.add(new Option(t("all_chips"),""));
[...fams.entries()].sort((a,b)=>b[1]-a[1]||chipLabel(a[0]).localeCompare(chipLabel(b[0]))).forEach(([id,n])=>sel.add(new Option(`${chipLabel(id)} (${n})`,id)));
const want=new URLSearchParams(location.search).get("chip")||"";if([...sel.options].some(o=>o.value===want)){chip=want;sel.value=want;}
sel.onchange=()=>{chip=sel.value;render();};render();})();
</script></body></html>
