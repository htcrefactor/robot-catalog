<!doctype html><html lang="en"><head><script async src="https://www.googletagmanager.com/gtm.js?id=GTM-N5QZLXVX"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/style.css"><script src="assets/i18n.js"></script><script src="assets/specs-i18n.js"></script><script src="assets/app.js"></script><script src="assets/price.js"></script><script src="assets/safety.js"></script><meta name="description" content="Full published specs for a mobile robot, with sources."><title>Robot Catalog</title></head>
<body><script>nav("")</script><main id="m"><p class="muted">…</p></main><div id="foot"></div>
<script>
(async()=>{const d=await loadData();const fx=await loadFx();const id=new URLSearchParams(location.search).get("id");
const r=d.robots.find(x=>x.id===id)||d.robots.find(x=>(x.variants||[]).some(v=>v.id===id));const m=document.getElementById("m");document.getElementById("foot").innerHTML=footer(d.meta);
if(!r){m.innerHTML=`<h1>${t("not_found")}</h1><p><a href="index.html">${t("back")}</a></p>`;return;}
document.title=`${r.manufacturer} ${r.name} — ${t("brand")}`;{const m=document.querySelector('meta[name="description"]');if(m)m.content=`${r.manufacturer} ${r.name} specs: every published value with sources — Robot Catalog`};
// Analytics (GA4-generated Google tag GTM-N5QZLXVX -> G-6QQWXESTB0, sent as gtag events, no GTM console tags needed): robot_open once per page view, maker_link_click on outbound maker/source links.
{const ev={robot_id:r.id,robot_name:r.name,manufacturer:r.manufacturer,robot_category:r.category};const ga=(n,o)=>{if(typeof gtag==="function")gtag("event",n,o);};ga("robot_open",ev);
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-lt]");if(!a)return;let dom="";try{dom=new URL(a.href).hostname}catch(_){}
ga("maker_link_click",{...ev,link_type:a.dataset.lt,link_url:a.href,link_domain:dom});});}
const row=(k,v,f)=>`<tr><td>${t(k)}</td><td>${v}${pvBadge(r,f)}</td></tr>`;
const KINDS={direct:"kr_channel_direct",distributor:"kr_channel_distributor",reseller:"kr_channel_reseller"};
const titleName=LANG==="ko"&&r.name_ko?r.name_ko:r.name;
const titleSub=LANG==="ko"?(r.name_ko?r.name:""):(r.name_ko||"");
const makerName=LANG==="ko"&&r.manufacturer_ko?r.manufacturer_ko:r.manufacturer;
const makerSub=LANG==="ko"?(r.manufacturer_ko?r.manufacturer:""):(r.manufacturer_ko||"");
const krDist=Array.isArray(r.kr_distributors)?r.kr_distributors:[];
const krPanel=(krDist.length||r.kr_note)?`<div class="panel"><h2>${t("kr_channels")}</h2>${r.kr_note?`<p class="small"><b>${t("kr_note_label")}:</b> ${esc(r.kr_note)}</p>`:""}${krDist.length?`<ul class="small">${krDist.map(d=>`<li><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a>${d.kind?` <span class="muted">· ${esc(t(KINDS[d.kind]||d.kind))}</span>`:""}</li>`).join("")}</ul>`:`<p class="muted small">${t("kr_no_channels")}</p>`}</div>`:"";
const dims=[r.length_mm,r.width_mm,r.height_mm].some(v=>v!=null)?[r.length_mm,r.width_mm,r.height_mm].map(v=>v??"?").join(" × ")+" mm":"—";
const peers=d.robots.filter(x=>x.category===r.category&&x.id!==r.id);
// "Suggest a correction" opens the correction issue form with this record's id filled in.
const ISSUES_NEW="https://github.com/htcrefactor/robot-catalog/issues/new";
const correctionUrl=()=>ISSUES_NEW+"?template=correction.yml&title="+encodeURIComponent(`[Correction] ${r.manufacturer} ${r.name}`)+"&robot_id="+encodeURIComponent(r.id)+"&robot_name="+encodeURIComponent(`${r.manufacturer} ${r.name}`)+"&robot_page="+encodeURIComponent(location.href);
// Related robots and same-maker lineup: deterministic ordering from published values only, no score or rank.
const MAX_REL=6;
const catKey=x=>x.category==="Misc"&&x.original_category?x.original_category:x.category;
const nn=v=>typeof v==="number"&&isFinite(v)?v:null;
const fitBand=(a,b)=>{const x=nn(a),y=nn(b);if(x===null||y===null||x===0)return 9;const q=Math.abs(x-y)/Math.abs(x);return q<=0.05?0:q<=0.15?1:q<=0.3?2:3;};
const relDiff=(a,b)=>{const x=nn(a),y=nn(b);if(x===null||y===null||x===0)return 9;return Math.abs(x-y)/Math.abs(x);};
const sgn=v=>v>0?`+${fmt(v)}`:v<0?`-${fmt(-v)}`:"0";
const cmpKeys=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1;}return 0;};
const CMP_DIMS=["height_mm","weight_kg","payload_kg"]; // closest published height, then weight, then payload
const relKey=(m,x)=>{const k=[];CMP_DIMS.forEach(f=>{if(nn(m[f])!==null)k.push(fitBand(m[f],x[f]))});CMP_DIMS.forEach(f=>{if(nn(m[f])!==null)k.push(relDiff(m[f],x[f]))});k.push(x.name.toLowerCase(),x.id);return k;};
const lineupAll=d.robots.filter(x=>x.id!==r.id&&x.manufacturer===r.manufacturer).sort((a,b)=>cmpKeys([catKey(a)===catKey(r)?0:1,a.release_year==null?1:0,a.release_year==null?0:-a.release_year,a.name.toLowerCase(),a.id],[catKey(b)===catKey(r)?0:1,b.release_year==null?1:0,b.release_year==null?0:-b.release_year,b.name.toLowerCase(),b.id]));
const relatedAll=d.robots.filter(x=>x.id!==r.id&&x.manufacturer!==r.manufacturer&&catKey(x)===catKey(r)).sort((a,b)=>cmpKeys(relKey(r,a),relKey(r,b)));
const specRow=(k,mine,v,u)=>{const n=nn(v);if(n===null)return `<span>${t(k)}</span><span class="muted">—</span>`;const b=nn(mine);return `<span>${t(k)}</span><span>${fmt(n,u)}${b===null?"":` <span class="muted small">${sgn(n-b)}</span>`}</span>`;};
const rcard=(x,showMaker)=>`<a class="card" href="robot.html?id=${encodeURIComponent(x.id)}">${showMaker?`<div class="mk">${esc(x.manufacturer)}</div>`:""}<div class="nm">${esc(x.name)}</div><div><span class="tag" style="background:${CAT_COLORS[x.category]}22;color:${CAT_COLORS[x.category]}">${esc(tv(x.category))}</span><span class="tag plain">${esc(tv(x.locomotion))}</span>${x.release_year?`<span class="tag plain">${esc(String(x.release_year))}</span>`:""}</div><div class="kv">${specRow("height",r.height_mm,x.height_mm,"mm")}${specRow("weight",r.weight_kg,x.weight_kg,"kg")}${specRow("payload",r.payload_kg,x.payload_kg,"kg")}</div></a>`;
const moreTxt=(n,k)=>n>0?`<p class="small muted" style="margin:10px 0 0">${t(k,{n})}</p>`:"";
const lineupHtml=lineupAll.length?`<div class="panel"><h2>${t("lineup_title",{maker:esc(r.manufacturer)})}</h2><p class="muted small">${t("lineup_sub")}</p><div class="grid">${lineupAll.slice(0,MAX_REL).map(x=>rcard(x,false)).join("")}</div>${moreTxt(lineupAll.length-MAX_REL,"lineup_more")}</div>`:"";
const relatedHtml=relatedAll.length?`<div class="panel"><h2>${t("related_title")}</h2><p class="muted small">${t("related_sub")}</p><div class="grid">${relatedAll.slice(0,MAX_REL).map(x=>rcard(x,true)).join("")}</div>${moreTxt(relatedAll.length-MAX_REL,"related_more")}</div>`:"";
const price=(()=>{const o=latestObs(r);if(o)return priceText(o,fx);return r.price_usd==null?(r.price_note?esc(r.price_note):"—"):`$${r.price_usd.toLocaleString()}${r.price_note?` <span class="muted small">(${esc(r.price_note)})</span>`:""}`;})();
const cm=completeness(r);
const short=u=>{const s=u.replace(/^https?:\/\/(www\.)?/,"");const p=s.split("/");if(p[0]==="github.com"&&p.length>=3){const f=p[p.length-1];return p[1]+"/"+p[2]+(p.length>3?` · ${f}`:"")}return s.length>58?s.slice(0,55)+"…":s};
const link=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">${esc(short(u))}</a>`:"—";
const sdk=r.sdk||null;
const sdkBits=sdk?[(sdk.languages||[]).length?`${t("sdk_langs")}: ${esc(sdk.languages.join(", "))}`:"",sdk.open_source===true?t("sdk_open"):sdk.open_source===false?t("sdk_closed"):"",sdk.license?esc(sdk.license):""].filter(Boolean).join(" · "):"";
const simRows=SIMK.filter(k=>r.sim_models&&r.sim_models[k]).map(k=>{const v=r.sim_models[k];return `<tr><td>${t("sim_"+k)}</td><td>${link(v.url)}${v.license?` <span class="small muted">${esc(v.license)}</span>`:""}</td></tr>`}).join("");
const buildPanel=`<div class="panel"><h2>${t("build_with_it")}</h2><table>
${row("api",yn(r.api_support),"api_support")}
${row("sdk",yn(r.sdk_available==null&&sdk?true:r.sdk_available)+(r.sdk_name?` <span class="small">${esc(r.sdk_name)}</span>`:"")+(sdkBits?`<div class="small muted">${sdkBits}</div>`:"")+(sdk?`<div class="small">${link(sdk.url)}</div>`:""),["sdk_available","sdk_name"])}
${row("ros",yn(r.ros_support==null&&r.ros2_support===true?true:r.ros_support),"ros_support")}
${row("ros2",yn(r.ros2_support)+(r.ros2_url?`<div class="small">${link(r.ros2_url)}</div>`:""))}
${simRows||row("sim_models",`<span class="muted">${t("sim_none")}</span>`)}
${(r.open_source_repos||[]).length?row("oss_repos",`<ul class="small" style="margin:0;padding-left:18px">${r.open_source_repos.map(o=>`<li>${link(o.url)}${o.license?` <span class="muted">${esc(o.license)}</span>`:""}</li>`).join("")}</ul>`):""}
${row("onboard",yn(r.onboard_compute),"onboard_compute")}
${row("compute",fmt(r.compute_detail),"compute_detail")}
${row("sensors",(r.sensors||[]).map(esc).join(", ")||"—","sensors")}
</table><p class="small muted">${t("dev_note")}</p></div>`;
m.innerHTML=`<p class="small"><a href="index.html">${t("back")}</a></p>
<div class="muted" style="text-transform:uppercase;font-size:12px;letter-spacing:.5px">${esc(makerName)}${makerSub?` · ${esc(makerSub)}`:""} · ${esc(tv(r.country))}</div>
<h1>${esc(titleName)}${titleSub?` <span class="muted" style="font-size:.55em;letter-spacing:0">${esc(titleSub)}</span>`:""}</h1>
<p><span class="tag" style="background:${CAT_COLORS[r.category]}22;color:${CAT_COLORS[r.category]}">${esc(tv(r.category))}</span><span class="tag plain">${esc(tv(r.locomotion))}</span><span class="tag plain">${esc(tv(r.status))}</span></p>
<p>${esc(LANG==="ko"&&r.summary_ko?r.summary_ko:r.summary)}${LANG==="ko"&&!r.summary_ko&&r.summary?` <span class="muted small">(${t("summary_lang_note")})</span>`:""}</p>
<p class="small"><a href="${esc(correctionUrl())}" target="_blank" rel="noopener">${t("suggest_correction")}</a></p>
<div class="panel"><div class="cmphead"><h2>${t("completeness")}</h2><span class="cmpnum">${cm.pct}%</span><span class="small muted">${t("cmp_note",{n:cm.n,d:cm.d})}</span></div>
<div class="cmpbar"><i style="width:${cm.pct}%"></i></div>
<p class="small muted" style="margin:0 0 4px">${t("pv_legend")}</p>${pvLegend()}
<details class="cmphow"><summary>${t("cmp_how_title")}</summary><p class="small muted" style="margin:6px 0 0">${t("cmp_how")}</p></details></div>
<div class="spec">
<div class="panel"><h2>${t("body_motion")}</h2><table>${row("dims",dims,["length_mm","width_mm","height_mm"])}${row("weight",fmt(r.weight_kg,"kg"),"weight_kg")}${row("payload",fmt(r.payload_kg,"kg"),"payload_kg")}${row("max_speed",r.max_speed_mps==null?"—":`${fmt(r.max_speed_mps,"m/s")} (${fmt(kmh(r.max_speed_mps),"km/h")})`,"max_speed_mps")}${row("min_speed",fmt(r.min_speed_mps,"m/s"),"min_speed_mps")}${row("wheel_d",fmt(r.wheel_diameter_mm,"mm"),"wheel_diameter_mm")}${row("wheels",fmt(r.wheel_count),"wheel_count")}${row("dof",fmt(r.dof),"dof")}</table></div>
<div class="panel"><h2>${t("power_env")}</h2><table>${row("runtime",fmt(r.runtime_h,"h"),"runtime_h")}${row("battery",fmt(r.battery_wh,"Wh"),"battery_wh")}${row("ip",fmt(r.ip_rating),"ip_rating")}${row("released",fmt(r.release_year),"release_year")}${row("price",price,["price_usd","price_note"])}</table></div>
<div class="panel"><h2>${t("safety_cert")}</h2><table>${row("certifications",(r.certifications||[]).map(esc).join(", ")||"—","certifications")}${row("standards",(r.safety_standards||[]).map(esc).join(", ")||"—","safety_standards")}${row("perf_level",fmt(r.safety_pl),"safety_pl")}${row("payload_class",fmt(payloadClassLabel(r.payload_kg)))}</table>${r.safety_note?`<p class="small muted">${esc(r.safety_note)}</p>`:""}${hasSafety(r)?"":`<p class="small muted">${t("safety_none")}</p>`}${r.safety_source?`<p class="small"><a href="${esc(r.safety_source)}" target="_blank" rel="noopener">${t("safety_source")} ↗</a></p>`:""}</div>
${buildPanel}
</div>
${pricePanel(r,fx)}
${krPanel}
${r.misc_reason?`<div class="panel small"><b>${t("misc_why")}</b> ${esc(r.misc_reason)}</div>`:""}${(r.variants||[]).length?`<div class="panel"><h2>${t("variants")}</h2><ul class="small">${r.variants.map(v=>`<li><b>${esc(v.name)}</b> — ${esc(LANG==="ko"&&v.note_ko?v.note_ko:v.note)}${v.url?` <a data-lt="variant" href="${esc(v.url)}" target="_blank" rel="noopener">↗</a>`:""}</li>`).join("")}</ul></div>`:""}
<div id="full"></div>
<div class="panel"><h2>${t("sources")}</h2>${r.official_url?`<p><a data-lt="official" href="${esc(r.official_url)}" target="_blank" rel="noopener">${t("official")}</a></p>`:""}<ul class="small">${(r.sources||[]).map(s=>`<li><a data-lt="source" href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join("")}</ul></div>
${lineupHtml}${relatedHtml}${peers.length?`<details class="panel"><summary><b>${t("other_in")}: ${esc(tv(r.category))}</b> <span class="muted small">${peers.length}</span></summary><p class="small">${peers.map(p=>`<a href="robot.html?id=${encodeURIComponent(p.id)}">${esc(p.manufacturer)} ${esc(p.name)}</a>`).join(" · ")}</p></details>`:""}`;
const full=document.getElementById("full");
let sp=null,keys=null;
try{const [a,b]=await Promise.all([fetch(`data/specs/${encodeURIComponent(r.id)}.json`,{cache:"no-cache"}),fetch("data/spec_keys.json",{cache:"no-cache"})]);if(a.ok)sp=await a.json();if(b.ok)keys=await b.json();}catch(e){}
if(!sp||!sp.specs||!sp.specs.length){full.innerHTML=`<div class="panel"><h2>${t("full_specs")}</h2><p class="muted">${t("no_full_specs")}</p></div>`;return;}
const docs=sp.documents||[];
const draw=(all)=>{const by={};sp.specs.forEach(x=>{(by[x.group]=by[x.group]||[]).push(x)});
 const have=new Set(sp.specs.map(x=>x.key));
 if(all&&keys)keys.keys.forEach(k=>{if(!have.has(k.key))(by[k.group]=by[k.group]||[]).push({key:k.key,label:k.label,missing:1})});
 const order=[...GROUPS,...Object.keys(by).filter(g=>!GROUPS.includes(g))].filter(g=>by[g]);
 return order.map(g=>`<div class="panel"><h2>${esc(tg(g))} <span class="muted small">${by[g].filter(x=>!x.missing).length}</span></h2><table class="fs">${by[g].map(x=>x.missing?`<tr class="miss"><td>${esc(x.label)}</td><td class="muted">${t("not_published")}</td></tr>`:`<tr><td>${esc(x.label)}</td><td>${sv(x.value,x.unit)}${x.note?`<div class="small muted">${esc(x.note)}</div>`:""}${x.source?`<div class="small"><a data-lt="spec_source" href="${esc(x.source)}" target="_blank" rel="noopener">${esc(host(x.source))}${x.ref?" · "+esc(x.ref):""}</a></div>`:""}</td></tr>`).join("")}</table></div>`).join("");};
full.innerHTML=`<h2 style="margin-top:28px">${t("full_specs")}</h2><p class="muted small">${t("full_specs_sub",{n:sp.specs.length,d:docs.length})}</p>
<label class="small"><input type="checkbox" id="allf"> ${t("show_all_fields")}</label>
<div class="spec" id="fsg" style="margin-top:12px">${draw(false)}</div>
${docs.length?`<div class="panel"><h2>${t("documents")}</h2><ul class="small">${docs.map(d=>`<li><a data-lt="document" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title||d.url)}</a></li>`).join("")}</ul></div>`:""}`;
document.getElementById("allf").onchange=e=>{document.getElementById("fsg").innerHTML=draw(e.target.checked)};
})();
</script></body></html>
